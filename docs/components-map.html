<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Pulse Components Map</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f4f5f7; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; color: #1c2230; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { font-size: 12.5px; color: #5a6376; margin: 0 0 14px; }
  .legend { display: flex; gap: 18px; font-size: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 22px; height: 0; border-top: 2px dashed #1c2230; }
  .sw.red { border-color: #c0392b; }
  .tag { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; margin-right: 5px; vertical-align: 1px; }
  .tag.ai { background: #c0267a; color: #fff; }
  .tag.det { background: #3a4660; color: #fff; }
  .wrap { overflow-x: auto; }
  #grid { position: relative; min-width: 1500px; display: grid; grid-template-columns: 130px repeat(6, 1fr); background: #fff; border-radius: 8px; border: 1px solid #1c2230; }
  .hd { background: #141a2b; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-align: center; padding: 14px 6px; text-transform: uppercase; }
  .actor { background: #141a2b; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 8px; border-top: 1px solid #2b3350; }
  .actor b { font-size: 13px; }
  .actor i { font-style: normal; font-size: 10.5px; color: #aab3cc; margin-top: 2px; }
  .cell { padding: 16px 14px; display: flex; align-items: center; border-left: 1px dotted rgba(0,0,0,.18); min-height: 120px; }
  .box { width: 100%; background: #fff; border: 2px solid; border-radius: 6px; padding: 8px 10px; font-size: 11.5px; line-height: 1.38; position: relative; z-index: 2; }
  .box b { font-weight: 700; }
  svg#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
  .wlabel { font: 600 10.5px "IBM Plex Mono", Consolas, monospace; fill: #c0392b; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  /* row palettes */
  .cell.r-kavita { background: #e6eefb; } .box.r-kavita { border-color: #2f62c9; }
  .cell.r-sched { background: #fdf3da; } .box.r-sched { border-color: #d49a12; }
  .cell.r-settings { background: #e6f4e8; } .box.r-settings { border-color: #2e8b4a; }
  .cell.r-gem { background: #fbe6ef; } .box.r-gem { border-color: #c0267a; }
  .cell.r-sys { background: #e2f3ee; } .box.r-sys { border-color: #1f8a70; }
  .cell.r-src { background: #ece8f8; } .box.r-src { border-color: #6a4fc4; }
  .cell.r-store { background: #e9edf2; } .box.r-store { border-color: #4a5870; }
  .cell.r-email { background: #fde9df; } .box.r-email { border-color: #d65a22; }
  .cell.r-web { background: #e4f1fb; } .box.r-web { border-color: #1f7fc0; }
  .cell.r-ops { background: #f1ece3; } .box.r-ops { border-color: #8a6a3a; }
  .cell.r-eval { background: #eef2dc; } .box.r-eval { border-color: #7a8f1f; }
</style>
</head>
<body>
<h1>Research Pulse: Components Map</h1>
<p class="sub">Weekly AI/ML research brief for Kavita. Gemini Flash is the only model used. Deterministic code makes every ranking, budget and delivery decision.</p>
<div class="legend">
  <span><i class="tag ai">AI</i> Gemini Flash call</span>
  <span><i class="tag det">CODE</i> deterministic</span>
  <span><i class="sw"></i> data / control flow</span>
  <span><i class="sw red"></i> conditional or loop</span>
</div>
<div class="wrap"><div id="grid"></div></div>

<script>
const COLS = ["Trigger","Input","Context","Processing","AI","Output"];
const AI = '<i class="tag ai">AI</i>', CODE = '<i class="tag det">CODE</i>';

const ROWS = [
 {id:"kavita", cls:"r-kavita", name:"Kavita", sub:"Consultant", boxes:[
   {id:"k1", c:0, h:`Kavita changes her domain list in Settings as client mandates shift. <b>No code, no deploy, no passcode.</b>`},
   {id:"k2", c:5, h:`Starts on the <b>overview</b> (top 3 and a photo tile per domain), then opens each <b>domain page</b>: the <b>This week</b> line and cards tagged New benchmark / Surprising result / Reframes the problem, with Read / Skim / Client-flag. Under 10 minutes.`}]},
 {id:"sched", cls:"r-sched", name:"Scheduler", sub:"Vercel Cron + GitHub Actions", boxes:[
   {id:"s1", c:0, h:`<b>Vercel Cron</b>, Monday 00:00 UTC, creates the week's job graph and starts on it. Six more Vercel Cron steps (00:15 to 04:30 UTC) keep working it. A GitHub Actions ticker is an optional backup.`},
   {id:"s2", c:1, h:`Each step claims jobs with a lease and runs them for up to ~4 min, then returns. No job makes more than one Gemini call; a job over 52 s is abandoned and retried.`},
   {id:"s3", c:5, h:`Cutoff Monday 02:00 UTC (7:30 IST): publishes what is ready, marked <b>partial</b>, then recomposes once if late domains finish. Stuck jobs are re-queued.`}]},
 {id:"settings", cls:"r-settings", name:"Settings", sub:"Next.js + Neon", boxes:[
   {id:"st1", c:1, h:`Domain form: name, arXiv categories, keywords, a <b>"what matters to me"</b> note, max papers.`},
   {id:"st2", c:3, h:`${CODE} Validates with Zod, caps domains and papers, shows the query-expansion preview. <b>No passcode</b> (owner's choice): saves and AI suggestions are rate limited.`},
   {id:"st3", c:5, h:`Saved to Neon (domains table). The previous list is kept, so <b>Undo last change</b> restores it in one click. The next run picks it up.`}]},
 {id:"expand", cls:"r-gem", name:"Gemini Flash", sub:"Query expander", boxes:[
   {id:"x1", c:2, h:`Domain name + intent note. Runs only when Kavita clicks <b>Suggest</b>.`},
   {id:"x2", c:4, h:`${AI} Turns "AI agents" into categories, 6 to 10 search phrases and negative keywords.`},
   {id:"x3", c:5, h:`Expanded queries returned for Kavita to review and edit.`}]},
 {id:"ingest", cls:"r-sys", name:"System", sub:"Ingest and prefilter", boxes:[
   {id:"i1", c:1, h:`Run starts. Fetches the week <b>plus a 3-day look back</b>: arXiv only publishes late-week papers on Monday evening, after the run. One job per day (10 per domain).`},
   {id:"i2", c:2, h:`Reads Neon: the domain snapshot for this run, and which papers <b>last week's run already covered</b>.`},
   {id:"i3", c:3, h:`${CODE} Joins arXiv + HF by ID, strips versions, skips papers already covered by an earlier brief, then <b>keyword match + capped attention</b> picks <b>~25 per domain</b> (no embeddings).`},
   {id:"i4", c:5, h:`Shortlist saved. Days arXiv could not serve are skipped and the brief is flagged <b>stale</b>; Hugging Face still contributes.`}]},
 {id:"sources", cls:"r-src", name:"Sources", sub:"Live external data", boxes:[
   {id:"so1", c:2, h:`<b>arXiv API</b>: papers by category + keyword, one day per request. Spaced 3 s apart, retried on 429/5xx/timeouts, never on 4xx.`},
   {id:"so2", c:3, h:`<b>Hugging Face Daily Papers</b>: upvotes as an attention signal. Ranking still works if it is down.`}]},
 {id:"judge", cls:"r-gem", name:"Gemini Flash", sub:"Judge", boxes:[
   {id:"g1", c:2, h:`<b>Rubric</b> (in code, versioned r2): relevance, evidence, hype, and the three named signals: <b>new benchmark, surprising result, reframing</b>.`},
   {id:"g2", c:4, h:`${AI} Scores 8 abstracts per call as JSON, temperature 0, one-line rationale citing the abstract. Cached per paper, domain focus and rubric version.`},
   {id:"g3", c:5, h:`Zod-validated scores. One repair retry, then the domain <b>degrades</b> to unscored top papers.`}]},
 {id:"rank", cls:"r-sys", name:"System", sub:"Rank", boxes:[
   {id:"r1", c:3, h:`${CODE} Signal = the strongest of the three (any one is enough). Quality = 0.40 signal + 0.35 evidence + 0.25 relevance − hype. Attention only orders.`},
   {id:"r2", c:5, h:`Threshold applied. Below it the domain shows <b>quiet week</b>, no padding. Top-k go to the writer.`}]},
 {id:"writer", cls:"r-gem", name:"Gemini Flash", sub:"Writer and verifier", boxes:[
   {id:"w1", c:2, h:`Guardrails: <b>abstract + metadata only</b>. Abstracts are data, never instructions. JSON schema enforced.`},
   {id:"w2", c:4, h:`${AI} Writes why it matters, a 2 to 3 sentence summary, <b>Read / Skim / Client-flag</b>, client angle, caveats, evidence quote. Then a <b>verify pass</b> marks each claim supported or not.`},
   {id:"w3", c:5, h:`Claims the verifier rejects are dropped. Evidence quote must be verbatim and every number must appear in the abstract (checked in code), else the abstract's own sentences are used.`}]},
 {id:"synth", cls:"r-gem", name:"Gemini Flash", sub:"Weekly takeaway", boxes:[
   {id:"t1", c:2, h:`The domain's verified cards + titles of other papers that cleared the bar.`},
   {id:"t2", c:4, h:`${AI} Writes <b>This week:</b> one or two sentences on what the papers show <b>together</b>, citing the papers it uses.`},
   {id:"t3", c:5, h:`Kept only if it cites 2+ papers in the brief (1+ verified), adds no numbers, and makes no "consensus / proves" claim. Otherwise left out.`}]},
 {id:"compose", cls:"r-sys", name:"System", sub:"Compose", boxes:[
   {id:"c1", c:1, h:`Verified cards per domain.`},
   {id:"c2", c:3, h:`${CODE} <b>≤ 1,800 words</b> (about 9 min) enforced in code, cross-domain top 3, takeaways counted, confidence labels, quiet-week lines.`},
   {id:"c3", c:5, h:`Saved to the <b>briefs</b> table in Neon. A labelled sample brief shows until the first live run.`}]},
 {id:"store", cls:"r-store", name:"Neon Postgres", sub:"Database", boxes:[
   {id:"d1", c:2, h:`Tables: <b>domains</b>, <b>briefs</b> (one row per week), <b>kv</b> (job queue, leases, score cache, <b>sent</b> guards). A claim is one atomic INSERT.`}]},
 {id:"email", cls:"r-email", name:"Email", sub:"Resend", boxes:[
   {id:"e1", c:3, h:`${CODE} One email per week and variant, guarded before sending, plus a Resend idempotency key. Plain-text part; partial at the cutoff, then one <b>Updated</b> email.`},
   {id:"e2", c:5, h:`<b>Monday email</b>: top 3, a <b>This week</b> line per domain, signal tags, link to the full brief.`}]},
 {id:"web", cls:"r-web", name:"Web app", sub:"Overview page", boxes:[
   {id:"web0", c:2, h:`Reads the newest week from the <b>briefs</b> table in Neon (or any past week).`},
   {id:"web2", c:3, h:`${CODE} Renders the overview: hero with the week's stats, the top 3 stories, and a <b>photo tile per domain</b> (takeaway, paper count, verdict tally).`},
   {id:"web1", c:5, h:`<b>Overview</b> at <b>/</b> (past weeks: /brief/&lt;week&gt;). Shows what the week covers and banners for <b>sample, stale or partial</b> data.`}]},
 {id:"webd", cls:"r-web", name:"Web app", sub:"Domain pages", boxes:[
   {id:"wd1", c:2, h:`<b>Unsplash photo</b> per domain (free licence, photographer credited), tinted in the domain's colour. Generated artwork for domains added later.`},
   {id:"wd2", c:3, h:`${CODE} One page per domain: photo header, the <b>This week</b> takeaway, every paper (top stories first), and previous / next domain.`},
   {id:"wd3", c:5, h:`<b>/domain/&lt;id&gt;</b> (past weeks: /brief/&lt;week&gt;/&lt;id&gt;). Sticky tabs switch between the overview and each domain.`}]},
 {id:"ops", cls:"r-ops", name:"Ops", sub:"Reliability", boxes:[
   {id:"o1", c:3, h:`${CODE} Records each job's AI calls, tokens, retries and malformed answers. Stuck jobs recover when their lease expires; old rows are swept.`},
   {id:"o2", c:5, h:`<b>/status</b>: job progress, AI totals, and problems with credentials redacted.`}]},
 {id:"eval", cls:"r-eval", name:"Evaluation", sub:"Offline, before submission", boxes:[
   {id:"ev1", c:0, h:`Run manually before each release.`},
   {id:"ev2", c:2, h:`Labelling file: <b>100 real papers</b> from a live week (labels pending, needs a human).`},
   {id:"ev3", c:3, h:`Recall and precision vs labels; 130+ offline tests incl. chaos and injection; adversarial checks against the real model.`},
   {id:"ev4", c:5, h:`Results in <b>docs/EVALUATION.md</b>; risks in <b>docs/FAILURE_MODES.md</b>.`}]},
];

const EDGES = [
 ["k1","st1"],
 ["st1","x1",{label:"on domain edit",red:true}],
 ["x1","x2"],["x2","x3"],
 ["x3","st2",{red:true,label:"Kavita approves"}],
 ["st1","st2"],["st2","st3"],
 ["s1","s2"],["s2","i1"],
 ["i1","so1"],["so1","i3"],["so2","i3"],["i2","i3"],["i3","i4"],
 ["i4","g2"],["g1","g2"],["g2","g3"],
 ["g3","r1"],["r1","r2"],
 ["r2","w2"],["w1","w2"],["w2","w3"],
 ["w3","t2"],["t1","t2"],["t2","t3"],["t3","c2"],["c1","c2"],["c2","c3"],
 ["c3","e1"],["e1","e2"],
 ["c3","web0"],["web0","web2"],["web2","web1"],["web1","wd2",{label:"open a domain"}],["wd1","wd2"],["wd2","wd3"],["wd3","k2"],
 ["e2","k2",{red:true,label:"Monday morning"}],
 ["web1","k2"],
 ["s2","s3",{red:true,label:"if not done by the 02:00 UTC cutoff"}],
 ["ev1","ev2"],["ev2","ev3"],["ev3","ev4"],
];

const grid = document.getElementById("grid");
grid.appendChild(Object.assign(document.createElement("div"),{className:"hd",textContent:""}));
COLS.forEach(c=>grid.appendChild(Object.assign(document.createElement("div"),{className:"hd",textContent:c})));
const rowIndex = {};
ROWS.forEach((r,ri)=>{
  const a = document.createElement("div");
  a.className = "actor " + r.cls;
  a.innerHTML = `<b>${r.name}</b><i>${r.sub}</i>`;
  a.style.cssText = "";
  grid.appendChild(a);
  for(let c=0;c<6;c++){
    const cell = document.createElement("div");
    cell.className = "cell " + r.cls;
    cell.parentRow = r.cls;
    const b = r.boxes.find(x=>x.c===c);
    if(b){ const d=document.createElement("div"); d.className="box "+r.cls; d.id=b.id; d.innerHTML=b.h; cell.appendChild(d); rowIndex[b.id]={row:ri,col:c}; }
    // palette applies via wrapper class on cell
    grid.appendChild(cell);
  }
});

const NS = "http://www.w3.org/2000/svg";
function draw(){
  const old = document.getElementById("wires"); if(old) old.remove();
  const svg = document.createElementNS(NS,"svg"); svg.id="wires";
  svg.innerHTML = `<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2230"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs>`;
  grid.appendChild(svg);
  const g = grid.getBoundingClientRect();
  const R = id => { const r=document.getElementById(id).getBoundingClientRect(); return {l:r.left-g.left,r:r.right-g.left,t:r.top-g.top,b:r.bottom-g.top,cx:(r.left+r.right)/2-g.left,cy:(r.top+r.bottom)/2-g.top}; };
  const ALL = Object.keys(rowIndex).map(id=>({id, ...R(id)}));
  EDGES.forEach(([a,b,o={}],i)=>{
    const A=R(a), B=R(b), ia=rowIndex[a], ib=rowIndex[b];
    const jit = ((i%5)-2)*3;
    let pts;
    const hits = (x,y1,y2)=>{ const lo=Math.min(y1,y2), hi=Math.max(y1,y2);
      return ALL.some(r=>r.id!==a && r.id!==b && x>r.l-3 && x<r.r+3 && hi>r.t && lo<r.b); };
    if(ia.row===ib.row){
      pts = ib.col>ia.col ? [[A.r,A.cy],[B.l,B.cy]] : [[A.l,A.cy],[B.r,B.cy]];
    } else {
      const down = ib.row>ia.row;
      const sy = down?A.b:A.t, ey = down?B.t:B.b, s = down?1:-1;
      if(ib.col===ia.col){
        if(Math.abs(ib.row-ia.row)===1 || !hits(A.cx,sy,ey)){ pts=[[A.cx,sy],[A.cx,ey]]; }
        else { const lx = A.r+7+((i%3)*3); pts=[[A.r,A.cy],[lx,A.cy],[lx,B.cy],[B.r,B.cy]]; }
      } else {
        const k = (i%4)*5;
        const ax = A.cx+jit*2, bx = B.cx+jit*2;
        const y1 = sy+s*(12+k), y2 = ey-s*(12+k);
        if(!hits(ax,sy,y2)){        // go over in the gap just above the target
          pts=[[ax,sy],[ax,y2],[bx,y2],[bx,ey]];
        } else if(!hits(bx,y1,ey)){ // go over in the gap just below the source
          pts=[[ax,sy],[ax,y1],[bx,y1],[bx,ey]];
        } else {                    // fall back to side lane
          const lx = (ib.col>ia.col? B.l-9 : B.r+9)+jit;
          pts=[[ib.col>ia.col?A.r:A.l,A.cy],[lx,A.cy],[lx,B.cy],[ib.col>ia.col?B.l:B.r,B.cy]];
        }
      }
    }
    const p = document.createElementNS(NS,"path");
    p.setAttribute("d","M"+pts.map(q=>q.join(" ")).join(" L"));
    p.setAttribute("fill","none");
    p.setAttribute("stroke",o.red?"#c0392b":"#1c2230");
    p.setAttribute("stroke-width","1.4");
    p.setAttribute("stroke-dasharray","5 4");
    p.setAttribute("marker-end",o.red?"url(#ahr)":"url(#ah)");
    svg.appendChild(p);
    if(o.label){
      const m = pts[Math.floor(pts.length/2)-1<0?0:Math.floor(pts.length/2)-1], n = pts[Math.floor(pts.length/2)];
      const t = document.createElementNS(NS,"text"); t.setAttribute("class","wlabel");
      t.setAttribute("x",(m[0]+n[0])/2+6); t.setAttribute("y",(m[1]+n[1])/2-4);
      t.textContent=o.label; svg.appendChild(t);
    }
  });
}
// apply row palettes to cells: cells inherit class from row via the actor sibling logic
document.querySelectorAll(".cell").forEach(c=>{ c.className = "cell " + c.parentRow; });
window.addEventListener("load",()=>setTimeout(draw,50));
window.addEventListener("resize",draw);
if(document.fonts) document.fonts.ready.then(draw);
</script>
</body>
</html>
